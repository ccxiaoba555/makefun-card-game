<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Sigil Duel</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="stage">
  <div id="table">
    <div id="foe-area" class="side foe-side"></div>
    <div id="mid-area">
      <div id="foe-played" class="played-row"></div>
      <div id="mid-info">
        <div id="turn-banner">Your turn</div>
        <div id="log" aria-live="polite"></div>
      </div>
      <div id="player-played" class="played-row"></div>
    </div>
    <div id="player-area" class="side player-side"></div>
    <div id="hand"></div>
    <div id="controls">
      <button id="end-turn" type="button">End Turn [E]</button>
      <button id="restart" type="button">Restart [R]</button>
    </div>
    <div id="overlay"></div>
  </div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
